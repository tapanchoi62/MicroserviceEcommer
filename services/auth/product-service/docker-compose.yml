version: "3.9"

services:
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - DB_HOST=host.docker.internal
      - REDIS_HOST=host.docker.internal
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5433/product_db
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
