version: "3.9"

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # ── Docker-specific overrides ──────────────────────────
      - DB_HOST=host.docker.internal
      - REDIS_HOST=host.docker.internal
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/auth_db

      # ── OAuth credentials (override from .env or set here) ──
      # For production/staging, use docker-compose.override.yml
      # or pass via: docker run -e GITHUB_CLIENT_ID=xxx ...
      # Examples:
      # - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      # - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
