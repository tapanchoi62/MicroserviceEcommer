# ══════════════════════════════════════════════════════════════
# Docker Compose Override — Sensitive Credentials
#
# Copy this to docker-compose.override.yml and fill in your credentials
# docker-compose.override.yml is ignored by git, so it's safe for secrets
# ══════════════════════════════════════════════════════════════

version: "3.9"

services:
  auth-service:
    environment:
      # ── GitHub OAuth ────────────────────────────────────────
      # Get from: https://github.com/settings/developers
      - GITHUB_CLIENT_ID=your_github_client_id_here
      - GITHUB_CLIENT_SECRET=your_github_client_secret_here

      # ── Google OAuth ────────────────────────────────────────
      # Get from: https://console.cloud.google.com/
      - GOOGLE_CLIENT_ID=your_google_client_id_here
      - GOOGLE_CLIENT_SECRET=your_google_client_secret_here

      # ── JWT Secrets (change in production!) ──────────────────
      - JWT_ACCESS_SECRET=your_long_random_string_for_access_token
      - JWT_REFRESH_SECRET=your_long_random_string_for_refresh_token

      # ── Database (if not using host.docker.internal) ────────
      # - DB_HOST=your_db_host
      # - DB_PASSWORD=your_db_password

      # ── Redis (if not using host.docker.internal) ──────────
      # - REDIS_HOST=your_redis_host
      # - REDIS_PASSWORD=your_redis_password
